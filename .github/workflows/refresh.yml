name: Refresh calendar data

on:
  schedule:
    # 22:00 UTC Sunday = 07:00 Monday Japan time
    - cron: "0 22 * * 0"
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "events-source.json"
      - "build.js"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Rebuild data.json
        run: node build.js
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain data.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data.json
            git commit -m "Auto-update calendar data ($(date +%Y-%m-%d))"
            git push
            echo "data.json updated and pushed."
          else
            echo "No change to data.json."
          fi
